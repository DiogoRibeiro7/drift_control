[project]
name = "drift-control"
version = "0.1.0"
description = "A lightweight package for monitoring and controlling data drift in machine learning models."
authors = [
    { name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }
]
license = {text = "MIT"}
maintainers = [
    { name = "Diogo Ribeiro", email = "diogo.debastos.ribeiro@gmail.com" }
]
readme = "README.md"
keywords = ["data-drift", "monitoring", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "click",
    "hypothesis",
    "tomli; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/DiogoRibeiro7/drift-control"
Documentation = "https://github.com/DiogoRibeiro7/drift-control/tree/main/docs"

[project.optional-dependencies]
viz = [
    "seaborn",
    "matplotlib",
    "plotly",
]
concept = [
    "river",
]
mlflow = [
    "mlflow",
]
stream = [
    "aiokafka",
    "aio-pika",
]
ml = [
    "category_encoders",
]
full = [
    "seaborn",
    "matplotlib",
    "plotly",
    "river",
    "mlflow",
    "aiokafka",
    "aio-pika",
    "category_encoders",
]

[project.scripts]
drift-control = "drift_control.cli:check"
drift-control-benchmark = "drift_control.cli:benchmark_report"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
files = [
  "drift_control/cli.py",
  "drift_control/config.py",
  "drift_control/energy_drift_detector.py",
  "drift_control/ensemble_drift_detector.py",
  "drift_control/result_schema.py",
  "drift_control/unified_drift_detector.py",
  "drift_control/validation.py",
]
exclude = [
  "^tests/",
]

[[tool.mypy.overrides]]
module = [
  "scipy",
  "scipy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "drift_control.c2st_drift_detector",
  "drift_control.categorical_chi2_drift_detector",
  "drift_control.categorical_tvd_drift_detector",
  "drift_control.psi_drift_detector",
  "drift_control.ks_drift_detector",
  "drift_control.cvm_drift_detector",
  "drift_control.js_drift_detector",
  "drift_control.wasserstein_drift_detector",
  "drift_control.mmd_drift_detector",
]
ignore_errors = true
