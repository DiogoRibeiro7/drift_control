[project]
name = "drift-control"
version = "0.1.0"
description = "A lightweight package for monitoring and controlling data drift in machine learning models."
authors = [
    { name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }
]
license = {text = "MIT"}
maintainers = [
    { name = "Diogo Ribeiro", email = "diogo.debastos.ribeiro@gmail.com" }
]
urls = {"Repository" = "https://github.com/DiogoRibeiro7/drift-control"}
readme = "README.md"
keywords = ["data-drift", "monitoring", "machine-learning"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "click",
]

[project.optional-dependencies]
viz = [
    "seaborn",
    "matplotlib",
    "plotly",
]
concept = [
    "river",
]
mlflow = [
    "mlflow",
]
stream = [
    "aiokafka",
    "aio-pika",
]
ml = [
    "category_encoders",
]
full = [
    "seaborn",
    "matplotlib",
    "plotly",
    "river",
    "mlflow",
    "aiokafka",
    "aio-pika",
    "category_encoders",
]

[project.scripts]
drift-control = "drift_control.cli:check"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
