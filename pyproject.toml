[project]
name = "drift-control"
version = "0.1.0"
description = "A lightweight package for monitoring and controlling data drift in machine learning models."
authors = [
    { name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }
]
license = {text = "MIT"}
maintainers = [
    { name = "Diogo Ribeiro", email = "diogo.debastos.ribeiro@gmail.com" }
]
readme = "README.md"
keywords = ["data-drift", "monitoring", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "click",
    "tomli; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/DiogoRibeiro7/drift_control"
Documentation = "https://github.com/DiogoRibeiro7/drift_control/tree/main/docs"

[project.optional-dependencies]
viz = [
    "seaborn",
    "matplotlib",
    "plotly",
]
concept = [
    "river",
]
mlflow = [
    "mlflow",
]
stream = [
    "aiokafka",
]
airflow = [
    "apache-airflow",
]
ml = [
    "category_encoders",
]
polars = [
    "polars",
]
notebooks = [
    "nbval",
    "ipykernel",
]
full = [
    "seaborn",
    "matplotlib",
    "plotly",
    "river",
    "mlflow",
    "aiokafka",
    "apache-airflow",
    "category_encoders",
    "polars",
]

[project.scripts]
drift-control = "drift_control.cli:check"
drift-control-benchmark = "drift_control.cli:benchmark_report"
drift-control-report = "drift_control.cli:report_command"

[tool.poetry.group.dev.dependencies]
pytest = "*"
hypothesis = "*"
pyarrow = "*"
ruff = "*"
mypy = "*"
nbval = "*"
ipykernel = "*"
# Without these mypy cannot check any pandas or yaml usage and reports
# "Library stubs not installed" instead, which is most of why the
# lint-typecheck job is red.
pandas-stubs = "*"
types-PyYAML = "*"
pytest-cov = "*"
pre-commit = "*"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["drift_control"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# A floor, not a target. Measured at 89% when this was added; set below that so
# ordinary churn does not fail the build, while a real regression does.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Notebooks are validated by nbval, not linted as source.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The long lines here are CSS and HTML inside a triple-quoted template, where a
# noqa comment would land in the rendered output and splitting them hurts
# readability. Everything else is kept in range by the formatter.
"drift_control/drift_report.py" = ["E501"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
files = ["drift_control"]
exclude = [
  "^tests/",
]

# scipy and sklearn ship no stubs. The rest are optional dependencies that the
# lint job deliberately does not install -- every import of them is guarded at
# runtime -- so a missing stub there is not a finding. Keep this list in step
# with [project.optional-dependencies], plus opentelemetry, which is optional
# without being an extra.
[[tool.mypy.overrides]]
module = [
  "scipy",
  "scipy.*",
  "sklearn.*",
  "aiokafka.*",
  "airflow.*",
  "category_encoders.*",
  "matplotlib.*",
  "mlflow.*",
  "plotly.*",
  "seaborn.*",
]
ignore_missing_imports = true

# opentelemetry arrives transitively with some extras and not with others, and
# its `metrics` / `trace` namespaces expose their API dynamically, so mypy
# reports attribute errors when it happens to be installed and nothing when it
# is not. Skipping it makes the result the same either way, which matters more
# than checking a guarded optional import.
[[tool.mypy.overrides]]
module = ["opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true
follow_imports = "skip"
