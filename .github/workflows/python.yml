name: CI
on: [push, pull_request]

# No job here pushes or releases; reading the repo is all that is needed.
permissions:
  contents: read
jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package + dev tooling
        run: |
          python -m pip install --upgrade pip poetry
          poetry install --with dev
      - name: Ruff (lint)
        run: poetry run ruff check .

      - name: Ruff (format)
        run: poetry run ruff format --check --diff .
      - name: Mypy
        run: poetry run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python (>=3.10) and the advertised classifiers.
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with dev tooling + test-relevant extras
        # This is every extra there is. The Airflow wrapper needs no extra:
        # it imports airflow lazily and the tests fake the module.
        run: |
          python -m pip install --upgrade pip poetry
          poetry install --with dev --extras "viz concept ml polars stream mlflow"
      - name: Run tests
        run: poetry run pytest -q --cov --cov-report=term-missing

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package + dev tooling + plotting extras
        run: |
          python -m pip install --upgrade pip poetry
          poetry install --with dev --extras "viz concept"
      - name: Validate showcase notebooks and tutorials
        # Both directories, enforced by tests/test_notebook_coverage.py. The
        # tutorials went unchecked for long enough to rot against the API.
        run: poetry run pytest --nbval-lax --nbval-current-env -q notebooks docs

  core-only:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core deps only
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest
      - name: Verify core import is lazy
        run: |
          python -c "import drift_control; print('core import ok:', drift_control.__version__)"
          pytest -q tests/test_optional_imports.py

  roadmap-milestones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core test deps
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest
      - name: Run roadmap milestone checks
        run: pytest -q tests/test_roadmap_milestones.py
