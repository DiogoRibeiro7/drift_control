name: CI
on: [push, pull_request]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install typing deps
        run: |
          python -m pip install --upgrade pip
          pip install . mypy
      - name: Run strict mypy
        run: |
          mypy

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install with all extras
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --without dev
          pip install ruff mypy
      - name: Run tests
        run: |
          poetry run pytest -q
          ruff .
          mypy

  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core deps only
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest
      - name: Verify core import is lazy
        run: |
          python -c "import drift_control; print('core import ok:', drift_control.__version__)"
          pytest -q tests/test_optional_imports.py
